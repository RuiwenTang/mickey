[workspace]
resolver = "3"
members = ["run-wasm"]

[package]
name = "mickey"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytemuck = {version = "1.21.0", features = ["derive"] }
nalgebra = "0.33.2"
wgpu = "24.0.1"

[dev-dependencies]
futures = "0.3.31"
winit = "0.30.11"
image = "0.25.5"

# web dependencies
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.77"
